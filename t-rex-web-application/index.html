    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #bckg {
            display: block;
            position: absolute;
            height: 100%;
            width: 1000%;
            left: -1000%;
            top: 0%;
            background: linear-gradient(90deg,
                    #ffffff 0%,
                    #000000 20%,
                    #000000 20%,
                    #000000 80%,
                    #000000 80%,
                    #ffffff 100%);
            animation: dayNightScroll 60s linear infinite;
        }

        @keyframes dayNightScroll {
            0% {
                left: 1000%;
            }
            100% {
                left: -1000%;
            }
        }

        #sun {
            display: block;
            position: absolute;
            height: 20%;
            width: auto;
            left: 100%;
            top: 10%;
            animation: sunScroll 60s linear infinite;
        }

        @keyframes sunScroll {
            0% {
                left: 100%;
            }
            100% {
                left: -100%;
            }
        }

        #moon {
            display: block;
            position: absolute;
            height: 10%;
            width: auto;
            right: -100%;
            top: 15%;
            animation: moonScroll 60s linear infinite;
        }

        @keyframes moonScroll {
            0% {
                right: -100%;
            }
            100% {
                right: 100%;
            }
        }

        .ground {
            display: block;
            position: absolute;
            height: 10%;
            width: 100%;
            top: 66%;
        }

        #ground1 {
            left: 100%;
            animation: ground1Scroll 5s linear infinite;
        }

        @keyframes ground1Scroll {
            0% {
                left: 100%;
            }
            100% {
                left: 0%;
            }
        }
        
        #ground2 {
            right: 0%;
            animation: ground2Scroll 5s linear infinite;
        }

        @keyframes ground2Scroll {
            0% {
                right: 0%;
            }
            100% {
                right: 100%;
            }
        }

        #trex {
            display: block;
            position: absolute;
            height: 30%;
            width: 10%;
            top: 41%;
        }
    </style>
</head>

<body>

    <div id="bckg"></div>
    <img id="sun" src="contents/sun.png">
    <img id="moon" src="contents/moon.png">
    <img class="ground" id="ground1" src="contents/ground.png">
    <img class="ground" id="ground2" src="contents/ground.png">
    <img id="trex" src="contents/t-rex.gif">

    <copyrights
        style="display: float; float: right; position: fixed; right: 4px; bottom: 0px; color: gray; text-align: center; font-family: sans-serif; font-size: 2.2vh; line-height: 2.2vh;">
        <b>© MAF</b>
    </copyrights>

    <script>

        var gamestart = false;

        var jumping;
        var jumpupinc = 0;
        var jumpdowninc = 0;
        var jumpinit = 0;
        var tRex = document.getElementById("trex");

        document.body.addEventListener("click", () => {

            if (!gamestart) {

                gamestart = true;
                
                document.body.addEventListener('keyup', event => {
                    if (event.code === 'Space' & jumpupinc == 0) {
                        jumping = true;
                    }
                });

                function gameLoop() {
                    const s = getComputedStyle(tRex);
                    if (jumping & jumpupinc == 0) {
                        jumpinit = parseInt(s.top);
                        jumpupinc++;
                    }
                    if (jumpupinc >= 1 & jumpupinc < 100) {
                        jumpupinc += 5;
                        tRex.style.top = jumpinit - jumpupinc + jumpdowninc + "px";
                    }
                    if (jumpupinc >= 100) {
                        jumpdowninc += 5;
                        tRex.style.top = jumpinit - jumpupinc + jumpdowninc + "px";
                    }
                    if (jumpdowninc >= 100) {
                        jumping = false;
                        jumpupinc = 0;
                        jumpdowninc = 0;
                        tRex.style.top = jumpinit - jumpupinc + jumpdowninc + "px";
                    }
                    requestAnimationFrame(gameLoop);
                }

                gameLoop();

            }

        });

        function intersects(r1, r2) {
            var insetx = window.innerWidth * 0.03;
            var insety = window.innerHeight * 0.03;
            return !(r2.x > r1.x + r1.width - insetx | r2.x + r2.width < r1.x + insetx | r2.y > r1.y + r1.height - insety | r2.y + r2.height < r1.y + insety);
        }

    </script>
