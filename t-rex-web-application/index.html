    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #bckg {
            display: block;
            position: absolute;
            height: 100%;
            width: 1000%;
            left: -1000%;
            top: 0%;
            background: linear-gradient(90deg,
                    #ffffff 0%,
                    #000000 20%,
                    #000000 20%,
                    #000000 80%,
                    #000000 80%,
                    #ffffff 100%);
            animation: dayNightScroll 60s linear infinite;
        }

        @keyframes dayNightScroll {
            0% {
                left: 1000%;
            }

            100% {
                left: -1000%;
            }
        }

        #sun {
            display: block;
            position: absolute;
            height: 20%;
            width: auto;
            left: 100%;
            top: 10%;
            animation: sunScroll 60s linear infinite;
        }

        @keyframes sunScroll {
            0% {
                left: 100%;
            }

            100% {
                left: -100%;
            }
        }

        #moon {
            display: block;
            position: absolute;
            height: 10%;
            width: auto;
            right: -100%;
            top: 15%;
            animation: moonScroll 60s linear infinite;
        }

        @keyframes moonScroll {
            0% {
                right: -100%;
            }

            100% {
                right: 100%;
            }
        }

        .ground {
            display: block;
            position: absolute;
            height: 10%;
            width: 100%;
            top: 66%;
        }

        #ground1 {
            left: 100%;
            animation: ground1Scroll 5s linear infinite;
        }

        @keyframes ground1Scroll {
            0% {
                left: 100%;
            }

            100% {
                left: 0%;
            }
        }

        #ground2 {
            right: 0%;
            animation: ground2Scroll 5s linear infinite;
        }

        @keyframes ground2Scroll {
            0% {
                right: 0%;
            }

            100% {
                right: 100%;
            }
        }

        #trex {
            display: block;
            position: absolute;
            height: 30%;
            width: 10%;
            top: 41%;
        }

        .cactus {
            display: block;
            position: absolute;
            height: 10%;
            width: 4%;
            top: 61%;
        }

        #cactus1 {
            animation: cactus1Scroll 10s linear infinite;
        }

        @keyframes cactus1Scroll {
            0% {
                left: 100%;
            }

            100% {
                left: -100%;
            }
        }

        #cactus2 {
            animation: cactus2Scroll 20s linear infinite;
        }

        @keyframes cactus2Scroll {
            0% {
                left: 230%;
            }

            100% {
                left: -170%;
            }
        }

        #cactus3 {
            animation: cactus3Scroll 10s linear infinite;
        }

        @keyframes cactus3Scroll {
            0% {
                left: 190%;
            }

            100% {
                left: -10%;
            }
        }

        #score {
            display: block;
            position: absolute;
            color: gray;
            left: 2%;
            top: 92%;
            font-size: 3.6vh;
            font-weight: 900;
        }

<body>

    <div id="bckg"></div>
    <img id="sun" src="contents/sun.png">
    <img id="moon" src="contents/moon.png">
    <img class="ground" id="ground1" src="contents/ground.png">
    <img class="ground" id="ground2" src="contents/ground.png">
    <img id="trex" src="contents/t-rex.gif">
    <img class="cactus" id="cactus1" src="contents/cactus.png">
    <img class="cactus" id="cactus2" src="contents/cactus.png">
    <img class="cactus" id="cactus3" src="contents/cactus.png">
    <div id="score">000000</div>

    <copyrights
        style="display: float; float: right; position: fixed; right: 4px; bottom: 0px; color: gray; text-align: center; font-family: sans-serif; font-size: 2.2vh; line-height: 2.2vh;">
        <b>© MAF</b>
    </copyrights>

    <script>

        var gamestart = false;

        var jumping;
        var jumpupinc = 0;
        var jumpdowninc = 0;
        var jumpinit = 0;
        var hiting = false;
        var scoreinc = 0;
        var tRex = document.getElementById("trex");
        var cactus1 = document.getElementById("cactus1");
        var cactus2 = document.getElementById("cactus2");
        var cactus3 = document.getElementById("cactus3");
        var score = document.getElementById("score");

        addEventListener("resize", (event) => { 
            tRex.style.top = "41%;";
        })

        document.body.addEventListener("click", () => {

            if (!gamestart) {

                gamestart = true;

                const hit = new Audio("contents/hit.mp3");
                hit.volume = 1;

                const press = new Audio("contents/button-press.mp3");
                press.volume = 1;

                const reach = new Audio("contents/score-reached.mp3");
                reach.volume = 1;

                document.body.addEventListener('keyup', event => {
                    if (event.code === 'Space' & jumpupinc == 0) {
                        jumping = true;
                    }
                });

                function gameLoop() {
                    const s = getComputedStyle(tRex);
                    if (jumping & jumpupinc == 0) {
                        jumpinit = parseInt(s.top);
                        jumpupinc++;
                        press.currentTime = 0;
                        press.play();
                    }
                    if (jumpupinc >= 1 & jumpupinc < 150) {
                        jumpupinc += 5;
                        tRex.style.top = jumpinit - jumpupinc + jumpdowninc + "px";
                    }
                    if (jumpupinc >= 150) {
                        jumpdowninc += 5;
                        tRex.style.top = jumpinit - jumpupinc + jumpdowninc + "px";
                    }
                    if (jumpdowninc >= 150) {
                        jumping = false;
                        jumpupinc = 0;
                        jumpdowninc = 0;
                        tRex.style.top = jumpinit - jumpupinc + jumpdowninc + "px";
                    }
                    if (intersects(tRex.getBoundingClientRect(), cactus1.getBoundingClientRect())
                        | intersects(tRex.getBoundingClientRect(), cactus2.getBoundingClientRect())
                        | intersects(tRex.getBoundingClientRect(), cactus3.getBoundingClientRect())) {
                        incrementScore(false);
                        hit.currentTime = 0;
                        hit.play();
                        hiting = true;
                        setTimeout(() => {hiting = false;}, 1000);
                    }
                    else if (reached(tRex.getBoundingClientRect(), cactus1.getBoundingClientRect())
                        | reached(tRex.getBoundingClientRect(), cactus2.getBoundingClientRect())
                        | reached(tRex.getBoundingClientRect(), cactus3.getBoundingClientRect())) {
                        if (!hiting) {
                            incrementScore(true);
                            reach.currentTime = 0;
                            reach.play();
                            hiting = true;
                            setTimeout(() => {hiting = false;}, 1000);
                        }
                    }
                    requestAnimationFrame(gameLoop);
                }

                gameLoop();

            }

        });

        function incrementScore(inc) {
            if (inc) {
                scoreinc++;
            } else {
                scoreinc = 0;
            }
            score.textContent = String(scoreinc).padStart(6, "0");
        }

        function intersects(r1, r2) {
            var insetx = window.innerWidth * 0.03;
            var insety = window.innerHeight * 0.03;
            return !(r2.x > r1.x + r1.width - insetx | r2.x + r2.width < r1.x + insetx | r2.y > r1.y + r1.height - insety | r2.y + r2.height < r1.y + insety);
        }

        function reached(r1, r2) {
            return r1.left > r2.right + 10 & r1.left < r2.right + 40;
        }

    </script>
