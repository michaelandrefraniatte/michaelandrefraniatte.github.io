    <title>TransferVoice by Michael</title>

    <style>
      #texttospeech {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 300px;
        height: 400px;
        overflow: hidden;
      }
    </style>

  </head>

  <body>

    <div id="texttospeech"></div>

    <copyrights
      style="display: float; float: right; position: fixed; right: 4px; bottom: 0px; color: black; text-align: center; font-family: sans-serif; font-size: 2.2vh; line-height: 2.2vh;">
      <b>© MAF</b>
    </copyrights>

    <script>

      var texttospeech = document.getElementById("texttospeech");

      var speechrecognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

      speechrecognition.continuous = true;
      speechrecognition.interimResults = false;
      speechrecognition.start();

      speechrecognition.onend = event => {
        speechrecognition.start();
      };

      speechrecognition.onresult = event => {
        var transcript = event.results[event.results.length - 1][0].transcript;
        texttospeech.textContent = "michael113b: " + transcript;
        speechText(transcript);
      };

      var msg = new SpeechSynthesisUtterance();

      function speechText(str) {
        msg.text = str;
        window.speechSynthesis.speak(msg);
      }

    </script>
