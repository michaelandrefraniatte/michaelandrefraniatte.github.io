        <style>
            * {
                padding: 0;
                margin: 0;
            }

            body {
                background: url("img/saloon.jpg") no-repeat center center fixed;
                background-size: cover;
                overflow: hidden;
            }

            div {
                display: float;
                float: left;
                width: 10vw;
                height: 10vh;
                background-color: green;
                padding: 0;
                margin: 0;
            }

            .rotate {
                animation: rotate 1s 1 alternate ease-out forwards;
            }

            @keyframes rotate {
                0% {
                    opacity: 1;
                    transform: rotateY(0deg);
                }

                99% {
                    opacity: 0;
                    transform: rotateY(90deg);
                }

                100% {
                    opacity: 0;
                    transform: rotateY(0deg);
                }
            }

            .notrotate {
                animation: notrotate 1s 1 alternate ease-out forwards;
            }

            @keyframes notrotate {
                0% {
                    opacity: 0;
                    transform: rotateY(90deg);
                }

                100% {
                    opacity: 1;
                    transform: rotateY(0deg);
                }
            }
            
            body.preload *{
                animation-duration: 0s !important;
                -webkit-animation-duration: 0s !important;
                transition:background-color 0s, opacity 0s, color 0s, width 0s, height 0s, padding 0s, margin 0s !important;
            }

        <script>

            document.querySelectorAll('div').forEach(function (div) {
                div.style.backgroundColor = getRandomColor();
            });

            function getRandomColor() {
                var letters = '0123456789ABCDEF';
                var color = '#';
                for (var i = 0; i < 6; i++) {
                    color += letters[Math.floor(Math.random() * 16)];
                }
                return color;
            }

            var divs = document.querySelectorAll('div');
            var toggle = false;

            setTimeout(function() {
                document.body.className = "";
                setInterval(rotate, 150);
            }, 1000);

            function rotate() {
                var inc = 0;
                var incrotate = 0;
                var incnotrotate = 0;
                divs.forEach(function (div) {
                    if (divs[inc].className == "rotate") {
                        incrotate++;
                    }
                    if (divs[inc].className == "notrotate") {
                        incnotrotate++;
                    }
                    inc++;
                });
                if (incrotate >= 100) {
                    toggle = true;
                }
                if (incnotrotate >= 100) {
                    toggle = false;
                }
                if (!toggle) {
                    var rndInt;
                    do {
                        rndInt = randomIntFromInterval(0, divs.length - 1);
                        if (divs[rndInt].className == "notrotate") {
                            divs[rndInt].classList.remove('notrotate');
                            divs[rndInt].classList.add('rotate');
                        }
                    }
                    while (divs[rndInt].className != "rotate");
                }
                else {
                    var rndInt;
                    do {
                        rndInt = randomIntFromInterval(0, divs.length - 1);
                        if (divs[rndInt].className == "rotate") {
                            divs[rndInt].classList.remove('rotate');
                            divs[rndInt].classList.add('notrotate');
                        }
                    }
                    while (divs[rndInt].className != "notrotate");
                }
            }

            function randomIntFromInterval(min, max) {
                return Math.floor(Math.random() * (max - min + 1) + min);
            }

            divs.forEach(function (div) {
                div.addEventListener('mouseover', function () {
                    if (document.body.className == "") {
                        if (!toggle) {
                            if (div.className == "notrotate") {
                                div.classList.remove('notrotate');
                                div.classList.add('rotate');
                            }
                        }
                        else {
                            if (div.className == "rotate") {
                                div.classList.remove('rotate');
                                div.classList.add('notrotate');
                            }
                        }
                    }
                });
            });

        </script>
