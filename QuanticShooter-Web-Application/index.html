    <title>QuanticShooter by Michael Franiatte</title>

    <script src="../custom/redirect.js"></script>

    <style>
        html {
            cursor: crosshair;
        }

        body {
            background: black;
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .vwalls {
            background-color: gray;
            width: 10px;
        }

        #vwall1 {
            display: block;
            position: absolute;
            left: 30%;
            top: 10%;
            height: 450px;
        }

        #vwall2 {
            display: block;
            position: absolute;
            left: 90%;
            top: 10%;
            height: 550px;
        }

        .hwalls {
            background-color: gray;
            height: 10px;
        }

        #hwall1 {
            display: block;
            position: absolute;
            left: 30%;
            top: 10%;
            width: 60%;
        }

        #hwall2 {
            display: block;
            position: absolute;
            left: 30%;
            top: calc(10% + 550px);
            width: 60%;
        }

        #vwall3 {
            display: block;
            position: absolute;
            left: 50%;
            top: 10%;
            height: 400px;
        }

        #door {
            position: absolute;
            background-color: red;
            width: 5px;
            height: 100px;
            left: 30%;
            top: calc(10% + 450px);
            transition: transform 0.4s ease;
        }

        #door.open {
            transform: translateY(-100%);
        }

        #door.close {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <canvas id="game"></canvas>
    <div class="vwalls" id="vwall1"></div>
    <div class="vwalls" id="vwall2"></div>
    <div class="hwalls" id="hwall1"></div>
    <div class="hwalls" id="hwall2"></div>
    <div class="vwalls" id="vwall3"></div>
    <div class="close" id="door"></div>

    <copyrights
        style="display: float; float: right; position: fixed; right: 4px; bottom: 0px; color: white; text-align: center; font-family: sans-serif; font-size: 2.2vh; line-height: 2.2vh;">
        <b>© MAF</b>
    </copyrights>

    <script>
        var gamestart = false;
        document.body.addEventListener("click", () => {

            if (!gamestart) {

                gamestart = true;

                const shoot = new Audio("contents/shoot.mp3");
                shoot.volume = 0.2;
                const enemyshoot = new Audio("contents/shoot.mp3");
                enemyshoot.volume = 0.2;
                const bullets = [];
                const canvas = document.getElementById("game");
                const ctx = canvas.getContext("2d");
                let walkCycle = 0;
                let blocked = false;
                let mouseX = 0;
                let mouseY = 0;
                const walls = [
                    document.getElementById("vwall1"),
                    document.getElementById("vwall2"),
                    document.getElementById("vwall3"),
                    document.getElementById("hwall1"),
                    document.getElementById("hwall2"),
                    document.getElementById("door")
                ];
                const door = document.getElementById("door");

                // Resize canvas
                function resize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                resize();
                window.addEventListener("resize", resize);

                // Player
                const player = {
                    x: 100,
                    y: 100,
                    speed: 4,
                    angle: 0
                };

                // Input
                let keys = {
                    ArrowUp: false,
                    ArrowDown: false,
                    ArrowLeft: false,
                    ArrowRight: false
                };

                const enemyPath = [
                    { x: 850, y: 150, angle: 0 },            // droite
                    { x: 1300, y: 150, angle: Math.PI / 2 },  // bas
                    { x: 1300, y: 400, angle: Math.PI },      // gauche
                    { x: 850, y: 400, angle: -Math.PI / 2 }, // haut
                ];

                const enemy = {
                    x: enemyPath[0].x,
                    y: enemyPath[0].y,
                    angle: 0,
                    visualAngle: 0,
                    speed: 4,
                    walkCycle: 0,
                    pathIndex: 0,
                    fireCooldown: 0,
                    fireRate: 40,
                    state: "patrol",
                    nextStopTime: 0,
                    stopTimer: 0
                };

                const enemyBullets = [];

                let blindness = 3;

                document.addEventListener("keydown", e => {
                    if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
                });

                document.addEventListener("keyup", e => {
                    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
                });

                // Mouse orientation
                canvas.addEventListener("mousemove", e => {
                    const rect = canvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;
                    mouseX = e.clientX - rect.left;
                    mouseY = e.clientY - rect.top;
                    player.angle = Math.atan2(my - player.y, mx - player.x);
                });

                function update() {
                    let moving = false;

                    let nextX = player.x;
                    let nextY = player.y;

                    if (keys.ArrowUp) { nextY -= player.speed; moving = true; }
                    if (keys.ArrowDown) { nextY += player.speed; moving = true; }
                    if (keys.ArrowLeft) { nextX -= player.speed; moving = true; }
                    if (keys.ArrowRight) { nextX += player.speed; moving = true; }

                    // Conversion CANVAS → ÉCRAN
                    const canvasRect = canvas.getBoundingClientRect();
                    const nextScreenX = canvasRect.left + nextX;
                    const nextScreenY = canvasRect.top + nextY;

                    blocked = false;
                    for (const w of walls) {
                        if (intersects(nextScreenX, nextScreenY, w)) {
                            blocked = true;
                            break;
                        }
                    }

                    // --- PORTE COULISSANTE ---
                    if (intersects(nextScreenX, nextScreenY, door)) {
                        if (door.classList == "close") {
                            door.classList.remove("close");
                            door.classList.add("open");
                            setTimeout(() => {
                                door.classList.remove("open");
                                door.classList.add("close");
                            }, 2500);
                        }
                    }

                    // Appliquer le mouvement
                    if (!blocked) {
                        player.x = nextX;
                        player.y = nextY;
                    }

                    if (moving & !blocked) walkCycle += 0.15;

                }

                function drawPlayer() {
                    ctx.save();
                    ctx.translate(player.x, player.y);
                    ctx.rotate(player.angle);

                    // Correction de l’orientation (vue du dessus réelle)
                    ctx.rotate(-Math.PI / 2);

                    // Détection du mouvement
                    const moving =
                        keys.ArrowUp || keys.ArrowDown ||
                        keys.ArrowLeft || keys.ArrowRight;

                    if (moving & !blocked) walkCycle += 0.15;

                    const swing = Math.sin(walkCycle);

                    // Mains
                    const handLeftX = -20 - swing * 2;
                    const handRightX = 20 + swing * 2;

                    // --- DIRECTION DE MARCHE (repère global) ---
                    let moveX = 0;
                    let moveY = 0;

                    if (keys.ArrowUp) moveY -= 1;
                    if (keys.ArrowDown) moveY += 1;
                    if (keys.ArrowLeft) moveX -= 1;
                    if (keys.ArrowRight) moveX += 1;

                    const len = Math.hypot(moveX, moveY);
                    if (len > 0) {
                        moveX /= len;
                        moveY /= len;
                    }

                    // --- CONVERSION DANS LE REPÈRE DU JOUEUR ---
                    // angle interne du joueur
                    const correctedAngle = player.angle - Math.PI / 2;

                    // rotation inverse du vecteur de marche
                    const moveLocalX = moveX * Math.cos(correctedAngle) + moveY * Math.sin(correctedAngle);
                    const moveLocalY = -moveX * Math.sin(correctedAngle) + moveY * Math.cos(correctedAngle);

                    // --- PIEDS ORIENTÉS CORRECTEMENT ---
                    const footOffsetLeft = moving ? -swing * 20 : 0;
                    const footOffsetRight = moving ? swing * 20 : 0;

                    const footLeftX = moveLocalX * footOffsetLeft;
                    const footLeftY = moveLocalY * footOffsetLeft;

                    const footRightX = moveLocalX * footOffsetRight;
                    const footRightY = moveLocalY * footOffsetRight;

                    ctx.strokeStyle = "white";
                    ctx.fillStyle = "white";
                    ctx.lineWidth = 4;

                    // Tête
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.stroke();

                    // Mains (-0-)
                    ctx.beginPath();
                    ctx.moveTo(handLeftX, 0);
                    ctx.lineTo(handRightX, 0);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(handLeftX, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(handRightX, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Barre verticale des pieds (|0|)
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(0, -10);
                    ctx.lineTo(0, 10);
                    ctx.stroke();

                    // Pieds réalistes
                    if (moving & !blocked) {
                        ctx.beginPath();
                        ctx.arc(-7 + footLeftX, footLeftY, 6, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(7 + footRightX, footRightY, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }

                // Main loop
                function loop() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    update();
                    updateBullets();

                    drawPlayer();
                    drawBullets();

                    updateEnemy();
                    enemyShoot();
                    updateEnemyBullets();

                    updateEnemyVisualRotation();
                    drawEnemy();
                    drawEnemyBullets();

                    requestAnimationFrame(loop);
                }

                loop();

                canvas.addEventListener("mousedown", e => {
                    if (e.button === 0) {

                        // Angle réel du joueur (avec correction -90°)
                        const correctedAngle = player.angle - Math.PI / 2;

                        // Position locale de la main droite (dans drawPlayer)
                        const handRightX = 20 + Math.sin(walkCycle) * 2; // EXACT comme ton dessin
                        const handRightY = 0;

                        // Conversion locale -> globale
                        const startX =
                            player.x +
                            handRightX * Math.cos(correctedAngle) -
                            handRightY * Math.sin(correctedAngle);

                        const startY =
                            player.y +
                            handRightX * Math.sin(correctedAngle) +
                            handRightY * Math.cos(correctedAngle);

                        // Direction vers la souris
                        const dx = mouseX - startX;
                        const dy = mouseY - startY;
                        const bulletAngle = Math.atan2(dy, dx);

                        bullets.push({
                            x: startX,
                            y: startY,
                            angle: bulletAngle,
                            speed: 12
                        });

                        shoot.currentTime = 0;
                        shoot.play();

                        blindness = 0.5;
                        setTimeout(() => {
                            blindness = 3;
                        }, 4500);
                    }
                });

                function updateBullets() {
                    for (let b of bullets) {
                        b.x += Math.cos(b.angle) * b.speed;
                        b.y += Math.sin(b.angle) * b.speed;
                    }
                    // Supprimer les projectiles hors écran
                    for (let i = bullets.length - 1; i >= 0; i--) {
                        const b = bullets[i];
                        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                            bullets.splice(i, 1);
                        }
                    }
                    // Collision balle joueur → ennemi
                    for (let i = bullets.length - 1; i >= 0; i--) {
                        const b = bullets[i];

                        const dx = b.x - enemy.x;
                        const dy = b.y - enemy.y;

                        if (Math.hypot(dx, dy) < 20) { // rayon de la tête de l'ennemi
                            bullets.splice(i, 1);
                            resetPositions();
                            return;
                        }
                    }
                }

                function drawBullets() {
                    ctx.fillStyle = "yellow";
                    for (let b of bullets) {
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    bullets.forEach((bullet, index) => {
                        // conversion canvas → écran
                        const canvasRect = canvas.getBoundingClientRect();
                        const bx = canvasRect.left + bullet.x;
                        const by = canvasRect.top + bullet.y;
                        // collision avec les murs
                        for (const w of walls) {
                            if (intersectsRect(bx, by, w)) {
                                bullets.splice(index, 1); // détruire la bullet
                                return;
                            }
                        }
                    });
                }

                function updateEnemy() {
                    if (enemySeesPlayer()) {
                        enemy.state = "chase";
                        enemy.speed = 2;
                    }
                    else {
                        enemy.state = "patrol";
                        enemy.speed = 4;
                    }
                    if (enemy.state === "patrol") updateEnemyPatrol();
                    else if (enemy.state === "chase") updateEnemyChase();
                }

                function drawEnemy() {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);
                    ctx.rotate(enemy.visualAngle);

                    // vue du dessus
                    ctx.rotate(-Math.PI / 2);

                    const moving = enemy.moving;
                    if (moving) enemy.walkCycle += 0.15;

                    const swing = Math.sin(enemy.walkCycle);

                    // Mains (déjà parfaites)
                    const handLeftX = -20 - swing * 2;
                    const handRightX = 20 + swing * 2;

                    // --- PIEDS DANS LE REPÈRE LOCAL (LA SOLUTION) ---
                    const footOffsetLeft = moving ? -swing * 20 : 0;
                    const footOffsetRight = moving ? swing * 20 : 0;

                    // direction locale du corps :
                    // X = droite/gauche
                    // Y = avant/arrière
                    const footLeftX = 0 * footOffsetLeft;   // pas de décalage latéral
                    const footLeftY = footOffsetLeft;       // avance/recul dans l’axe du corps

                    const footRightX = 0 * footOffsetRight;
                    const footRightY = footOffsetRight;

                    ctx.strokeStyle = "red";
                    ctx.fillStyle = "red";
                    ctx.lineWidth = 4;

                    // Tête
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.stroke();

                    // Bras
                    ctx.beginPath();
                    ctx.moveTo(handLeftX, 0);
                    ctx.lineTo(handRightX, 0);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(handLeftX, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(handRightX, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Barre centrale
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(0, -10);
                    ctx.lineTo(0, 10);
                    ctx.stroke();

                    // Pieds réalistes
                    if (moving) {
                        ctx.beginPath();
                        ctx.arc(-7 + footLeftX, footLeftY, 6, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(7 + footRightX, footRightY, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }

                function updateEnemyChase() {
                    const dx = player.x - enemy.x;
                    const dy = player.y - enemy.y;

                    enemy.angle = Math.atan2(dy, dx);

                    const nextX = enemy.x + Math.cos(enemy.angle) * enemy.speed;
                    const nextY = enemy.y + Math.sin(enemy.angle) * enemy.speed;

                    const canvasRect = canvas.getBoundingClientRect();
                    const ex = canvasRect.left + nextX;
                    const ey = canvasRect.top + nextY;

                    let blocked = false;
                    for (const w of walls) {
                        if (intersects(ex, ey, w)) {
                            blocked = true;
                            break;
                        }
                    }

                    enemy.moving = !blocked;

                    if (!blocked) {
                        enemy.x = nextX;
                        enemy.y = nextY;
                        enemy.walkCycle += 0.15;
                    }
                }

                function enemyShoot() {
                    if (!enemySeesPlayer()) return;

                    if (enemy.fireCooldown > 0) {
                        enemy.fireCooldown--;
                        return;
                    }

                    enemy.fireCooldown = enemy.fireRate;

                    // --- MAIN DROITE DE L'ENNEMI (comme ton joueur) ---
                    const swing = Math.sin(enemy.walkCycle);
                    const handRightX = 20 + swing * 2;
                    const handRightY = 0;

                    // angle interne (vue du dessus)
                    const correctedAngle = enemy.angle - Math.PI / 2;

                    // conversion locale -> globale
                    const startX =
                        enemy.x +
                        handRightX * Math.cos(correctedAngle) -
                        handRightY * Math.sin(correctedAngle);

                    const startY =
                        enemy.y +
                        handRightX * Math.sin(correctedAngle) +
                        handRightY * Math.cos(correctedAngle);

                    // direction vers le joueur
                    const dx = player.x - startX;
                    const dy = player.y - startY;
                    const bulletAngle = Math.atan2(dy, dx);

                    // tirer depuis la main droite
                    enemyBullets.push({
                        x: startX,
                        y: startY,
                        angle: bulletAngle,
                        speed: 8
                    });

                    enemyshoot.currentTime = 0;
                    enemyshoot.play();
                }

                function updateEnemyBullets() {
                    enemyBullets.forEach((b, index) => {
                        b.x += Math.cos(b.angle) * b.speed;
                        b.y += Math.sin(b.angle) * b.speed;

                        const canvasRect = canvas.getBoundingClientRect();
                        const bx = canvasRect.left + b.x;
                        const by = canvasRect.top + b.y;

                        for (const w of walls) {
                            if (intersects(bx, by, w)) {
                                enemyBullets.splice(index, 1);
                                return;
                            }
                        }
                        // Collision balle ennemi → joueur
                        const dx = b.x - player.x;
                        const dy = b.y - player.y;

                        if (Math.hypot(dx, dy) < 20) { // rayon de la tête du joueur
                            enemyBullets.splice(index, 1);
                            resetPositions();
                            return;
                        }
                    });
                }

                function drawEnemyBullets() {
                    ctx.fillStyle = "red";
                    enemyBullets.forEach(b => {
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                function updateEnemyPatrol() {

                    const now = performance.now();

                    // --- SI L'ENNEMI EST EN PAUSE ---
                    if (enemy.stopTimer > 0) {
                        enemy.stopTimer--;
                        enemy.moving = false;
                        return;
                    }

                    // --- ARRÊT ALÉATOIRE ENTRE 10 ET 30 SECONDES ---
                    if (now >= enemy.nextStopTime) {

                        // durée de l'arrêt : entre 5 et 10 secondes
                        enemy.stopTimer = Math.floor(300 + Math.random() * 300);
                        // 300 frames ≈ 5s, 600 frames ≈ 10s

                        // prochain arrêt dans 10 à 30 secondes
                        enemy.nextStopTime = now + (10000 + Math.random() * 20000);

                        enemy.moving = false;
                        return;
                    }

                    // --- PATROUILLE NORMALE ---
                    const target = enemyPath[enemy.pathIndex];

                    const dx = target.x - enemy.x;
                    const dy = target.y - enemy.y;

                    const dist = Math.hypot(dx, dy);

                    enemy.angle = Math.atan2(dy, dx);

                    if (dist > 5) {
                        enemy.x += Math.cos(enemy.angle) * enemy.speed;
                        enemy.y += Math.sin(enemy.angle) * enemy.speed;
                        enemy.walkCycle += 0.15;
                        enemy.moving = true;
                    } else {
                        enemy.pathIndex = (enemy.pathIndex + 1) % enemyPath.length;
                        enemy.moving = false;
                    }
                }

                function visionBlockedByWall(x1, y1, x2, y2) {
                    const canvasRect = canvas.getBoundingClientRect();

                    // On convertit les points en coordonnées écran
                    const ex1 = canvasRect.left + x1;
                    const ey1 = canvasRect.top + y1;
                    const ex2 = canvasRect.left + x2;
                    const ey2 = canvasRect.top + y2;

                    for (const w of walls) {
                        const r = w.getBoundingClientRect();

                        // Test simple : si la ligne traverse le rectangle du mur
                        if (
                            Math.min(ex1, ex2) < r.right &&
                            Math.max(ex1, ex2) > r.left &&
                            Math.min(ey1, ey2) < r.bottom &&
                            Math.max(ey1, ey2) > r.top
                        ) {
                            return true;
                        }
                    }

                    return false;
                }

                function enemySeesPlayer() {
                    const dx = player.x - enemy.x;
                    const dy = player.y - enemy.y;

                    const angleToPlayer = Math.atan2(dy, dx);
                    const diff = Math.abs(angleToPlayer - enemy.angle);

                    // hors du cône de vision
                    if (diff > Math.PI / blindness) return false;

                    // mur entre les deux ?
                    if (visionBlockedByWall(enemy.x, enemy.y, player.x, player.y)) return false;

                    return true;
                }

                function resetPositions() {
                    // Réinitialiser le joueur
                    player.x = 100;
                    player.y = 100;
                    player.angle = 0;

                    // Réinitialiser l'ennemi
                    enemy.x = enemyPath[0].x;
                    enemy.y = enemyPath[0].y;
                    enemy.angle = enemyPath[0].angle;
                    enemy.pathIndex = 0;
                    enemy.walkCycle = 0;
                    enemy.state = "patrol";
                    enemy.speed = 4;

                    // Effacer les balles
                    bullets.length = 0;
                    enemyBullets.length = 0;
                }

                function updateEnemyVisualRotation() {
                    const diff = enemy.angle - enemy.visualAngle;
                    const normalized = Math.atan2(Math.sin(diff), Math.cos(diff));

                    enemy.visualAngle += normalized * 0.15; // vitesse de rotation visuelle
                }

                function intersectsRect(px, py, rect) {
                    const r = rect.getBoundingClientRect();
                    return (
                        px >= r.left &&
                        px <= r.right &&
                        py >= r.top &&
                        py <= r.bottom
                    );
                }

                function intersects(px, py, rect) {
                    const r = rect.getBoundingClientRect();
                    const insetX = -window.innerWidth * 0.01;
                    const insetY = -window.innerHeight * 0.01;
                    return (
                        px >= r.left + insetX &&
                        px <= r.right - insetX &&
                        py >= r.top + insetY &&
                        py <= r.bottom - insetY
                    );
                }
            }
        });

    </script>
