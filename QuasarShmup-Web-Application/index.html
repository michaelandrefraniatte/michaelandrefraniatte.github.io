    <style>
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #animatedBackground {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: url("contents/LayoutBackGroundLvl1.png");
            background-repeat: repeat;
            background-position: 0 0;
            background-size: auto 100%;
            animation: animatedBackground 500s linear infinite;
        }

        @keyframes animatedBackground {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 50000px;
            }
        }

        #spaceShip {
            position: absolute;
            display: block;
            left: 45%;
            top: 80%;
            width: 10%;
            height: 12%;
        }

        #bullet1,
        #bullet2,
        #bullet3,
        #bullet4 {
            position: absolute;
            display: block;
            left: 45%;
            top: 80%;
            width: 10%;
            height: 6%;
        }

        #SmallRock1 {
            position: absolute;
            display: block;
            left: 25%;
            top: -20%;
            width: 3%;
            height: 5%;
            rotate: 30deg;
        }

        #SmallRock2 {
            position: absolute;
            display: block;
            left: 45%;
            top: -20%;
            width: 6%;
            height: 10%;
            rotate: 60deg;
        }

        #SmallRock3 {
            position: absolute;
            display: block;
            left: 65%;
            top: -20%;
            width: 9%;
            height: 15%;
            rotate: 90deg;
        }

        #BigRock1 {
            position: absolute;
            display: block;
            left: 25%;
            top: -40%;
            width: 3%;
            height: 5%;
            rotate: 30deg;
        }

        #BigRock2 {
            position: absolute;
            display: block;
            left: 45%;
            top: -40%;
            width: 6%;
            height: 10%;
            rotate: 60deg;
        }

        #BigRock3 {
            position: absolute;
            display: block;
            left: 65%;
            top: -40%;
            width: 9%;
            height: 15%;
            rotate: 90deg;
        }
    </style>
</head>

<body>

    <div id="animatedBackground"></div>
    <img id="spaceShip" src="contents/SpaceShipLvl1.png">
    <img id="bullet1" src="contents/BulletLvl1.png">
    <img id="bullet2" src="contents/BulletLvl1.png">
    <img id="bullet3" src="contents/BulletLvl1.png">
    <img id="bullet4" src="contents/BulletLvl1.png">
    <img id="SmallRock1" src="contents/SmallRockLvl1.png">
    <img id="SmallRock2" src="contents/SmallRockLvl1.png">
    <img id="SmallRock3" src="contents/SmallRockLvl1.png">
    <img id="BigRock1" src="contents/BigRockLvl1.png">
    <img id="BigRock2" src="contents/BigRockLvl1.png">
    <img id="BigRock3" src="contents/BigRockLvl1.png">

    <copyrights
        style="display: float; float: right; position: fixed; right: 4px; bottom: 0px; color: black; text-align: center; font-family: sans-serif; font-size: 2.2vh; line-height: 2.2vh;">
        <b>© MAF</b>
    </copyrights>

    <script>

        document.body.addEventListener("click", () => {

            const backgroundSound = new Audio("contents/Donkey Kong Bananza OST - Stickerbush Symphony (Extended).mp3");
            backgroundSound.volume = 1.0;
            backgroundSound.addEventListener("ended", () => {
                backgroundSound.currentTime = 0;
                backgroundSound.play();
            });
            backgroundSound.play();

            const firingSound = new Audio("contents/LaserShot7.mp3");
            firingSound.volume = 1.0;

            var keys = {};
            var spaceShipPosX = 0;
            var spaceShipPosY = 0;
            var spaceShip = document.getElementById("spaceShip");
            var firing1, firing2, firing3, firing4;
            var bullet1 = document.getElementById("bullet1");
            var bullet2 = document.getElementById("bullet2");
            var bullet3 = document.getElementById("bullet3");
            var bullet4 = document.getElementById("bullet4");
            var bullet1PosY = 0;
            var bullet2PosY = 0;
            var bullet3PosY = 0;
            var bullet4PosY = 0;
            var bullet1InitY = 0;
            var bullet2InitY = 0;
            var bullet3InitY = 0;
            var bullet4InitY = 0;
            var SmallRock1 = document.getElementById("SmallRock1");
            var SmallRock2 = document.getElementById("SmallRock2");
            var SmallRock3 = document.getElementById("SmallRock3");
            var BigRock1 = document.getElementById("BigRock1");
            var BigRock2 = document.getElementById("BigRock2");
            var BigRock3 = document.getElementById("BigRock3");
            var SmallRock1PosX = 0;
            var SmallRock1PosY = 0;
            var SmallRock2PosX = 0;
            var SmallRock2PosY = 0;
            var SmallRock3PosX = 0;
            var SmallRock3PosY = 0;
            var BigRock1PosX = 0;
            var BigRock1PosY = 0;
            var BigRock2PosX = 0;
            var BigRock2PosY = 0;
            var BigRock3PosX = 0;
            var BigRock3PosY = 0;
            var SmallRock1SpeedX = 0;
            var SmallRock1SpeedY = 0;
            var SmallRock2SpeedX = 0;
            var SmallRock2SpeedY = 0;
            var SmallRock3SpeedX = 0;
            var SmallRock3SpeedY = 0;
            var BigRock1SpeedX = 0;
            var BigRock1SpeedY = 0;
            var BigRock2SpeedX = 0;
            var BigRock2SpeedY = 0;
            var BigRock3SpeedX = 0;
            var BigRock3SpeedY = 0;
            var SmallRock1Rotate = 0;
            var SmallRock2Rotate = 0;
            var SmallRock3Rotate = 0;
            var BigRock1Rotate = 0;
            var BigRock2Rotate = 0;
            var BigRock3Rotate = 0;

            document.body.addEventListener("keydown", (event) => {
                keys[event.key] = true;
            });

            document.body.addEventListener("keyup", (event) => {
                keys[event.key] = false;
            });

            document.body.addEventListener('keyup', event => {
                if (event.code === 'Space') {
                    if (!firing1) {
                        firing1 = true;
                        firing4 = false;
                        firingSound.currentTime = 0;
                        firingSound.play();
                    }
                    else if (!firing2) {
                        firing2 = true;
                        firingSound.currentTime = 0;
                        firingSound.play();
                    }
                    else if (!firing3) {
                        firing3 = true;
                        firingSound.currentTime = 0;
                        firingSound.play();
                    }
                    else if (!firing4) {
                        firing4 = true;
                        firing1 = false;
                        firing2 = false;
                        firing3 = false;
                        firingSound.currentTime = 0;
                        firingSound.play();
                    }
                }
            });

            function gameLoop() {
                if (keys["ArrowLeft"]) {
                    if (spaceShipPosX + 45 >= 0) {
                        spaceShipPosX -= 0.5;
                    }
                }
                if (keys["ArrowRight"]) {
                    if (spaceShipPosX + 45 <= 90) {
                        spaceShipPosX += 0.5;
                    }
                }
                if (keys["ArrowUp"]) {
                    if (spaceShipPosY + 80 >= 0) {
                        spaceShipPosY -= 0.5;
                    }
                }
                if (keys["ArrowDown"]) {
                    if (spaceShipPosY + 80 <= 88) {
                        spaceShipPosY += 0.5;
                    }
                }
                spaceShip.style.left = (spaceShipPosX + 45) + "%";
                spaceShip.style.top = (spaceShipPosY + 80) + "%";
                if (firing1) {
                    bullet1PosY -= 4;
                    bullet1.style.top = bullet1PosY + bullet1InitY + "%";
                }
                else {
                    bullet1.style.left = (spaceShipPosX + 45) + "%";
                    bullet1.style.top = (spaceShipPosY + 80) + "%";
                    bullet1InitY = (spaceShipPosY + 80);
                    bullet1PosY = 0;
                }
                if (firing2) {
                    bullet2PosY -= 4;
                    bullet2.style.top = bullet2PosY + bullet2InitY + "%";
                }
                else {
                    bullet2.style.left = (spaceShipPosX + 45) + "%";
                    bullet2.style.top = (spaceShipPosY + 80) + "%";
                    bullet2InitY = (spaceShipPosY + 80);
                    bullet2PosY = 0;
                }
                if (firing3) {
                    bullet3PosY -= 4;
                    bullet3.style.top = bullet3PosY + bullet3InitY + "%";
                }
                else {
                    bullet3.style.left = (spaceShipPosX + 45) + "%";
                    bullet3.style.top = (spaceShipPosY + 80) + "%";
                    bullet3InitY = (spaceShipPosY + 80);
                    bullet3PosY = 0;
                }
                if (firing4) {
                    bullet4PosY -= 4;
                    bullet4.style.top = bullet4PosY + bullet4InitY + "%";
                }
                else {
                    bullet4.style.left = (spaceShipPosX + 45) + "%";
                    bullet4.style.top = (spaceShipPosY + 80) + "%";
                    bullet4InitY = (spaceShipPosY + 80);
                    bullet4PosY = 0;
                }
                SmallRock1PosX += SmallRock1SpeedX;
                SmallRock1PosY += SmallRock1SpeedY;
                SmallRock1.style.left = SmallRock1PosX + "%";
                SmallRock1.style.top = SmallRock1PosY + "%";
                SmallRock2PosX += SmallRock2SpeedX;
                SmallRock2PosY += SmallRock2SpeedY;
                SmallRock2.style.left = SmallRock2PosX + "%";
                SmallRock2.style.top = SmallRock2PosY + "%";
                SmallRock3PosX += SmallRock3SpeedX;
                SmallRock3PosY += SmallRock3SpeedY;
                SmallRock3.style.left = SmallRock3PosX + "%";
                SmallRock3.style.top = SmallRock3PosY + "%";
                BigRock1PosX += BigRock1SpeedX;
                BigRock1PosY += BigRock1SpeedY;
                BigRock1.style.left = BigRock1PosX + "%";
                BigRock1.style.top = BigRock1PosY + "%";
                BigRock2PosX += BigRock2SpeedX;
                BigRock2PosY += BigRock2SpeedY;
                BigRock2.style.left = BigRock2PosX + "%";
                BigRock2.style.top = BigRock2PosY + "%";
                BigRock3PosX += BigRock3SpeedX;
                BigRock3PosY += BigRock3SpeedY;
                BigRock3.style.left = BigRock3PosX + "%";
                BigRock3.style.top = BigRock3PosY + "%";
                if (SmallRock1PosX >= 120 | SmallRock1PosX <= -20 | SmallRock1PosY >= 120) {
                    SmallRock1PosX = 10 + parseInt(80 * Math.random());
                    SmallRock1PosY = -10 - parseInt(90 * Math.random());
                    SmallRock1SpeedX = (Math.random() * 2 - 1) / 3;
                    SmallRock1SpeedY = (0.2 + Math.random() * 2) / 3;
                    SmallRock1Rotate = parseInt(360 * Math.random());
                }
                if (SmallRock2PosX >= 120 | SmallRock2PosX <= -20 | SmallRock2PosY >= 120) {
                    SmallRock2PosX = 10 + parseInt(80 * Math.random());
                    SmallRock2PosY = -10 - parseInt(90 * Math.random());
                    SmallRock2SpeedX = (Math.random() * 2 - 1) / 3;
                    SmallRock2SpeedY = (0.2 + Math.random() * 2) / 3;
                    SmallRock2Rotate = parseInt(360 * Math.random());
                }
                if (SmallRock3PosX >= 120 | SmallRock3PosX <= -20 | SmallRock3PosY >= 120) {
                    SmallRock3PosX = 10 + parseInt(80 * Math.random());
                    SmallRock3PosY = -10 - parseInt(90 * Math.random());
                    SmallRock3SpeedX = (Math.random() * 2 - 1) / 3;
                    SmallRock3SpeedY = (0.2 + Math.random() * 2) / 3;
                    SmallRock3Rotate = parseInt(360 * Math.random());
                }
                if (BigRock1PosX >= 120 | BigRock1PosX <= -20 | BigRock1PosY >= 120) {
                    BigRock1PosX = 10 + parseInt(80 * Math.random());
                    BigRock1PosY = -10 - parseInt(90 * Math.random());
                    BigRock1SpeedX = (Math.random() * 2 - 1) / 3;
                    BigRock1SpeedY = (0.2 + Math.random() * 2) / 3;
                    BigRock1Rotate = parseInt(360 * Math.random());
                }
                if (BigRock2PosX >= 120 | BigRock2PosX <= -20 | BigRock2PosY >= 120) {
                    BigRock2PosX = 10 + parseInt(80 * Math.random());
                    BigRock2PosY = -10 - parseInt(90 * Math.random());
                    BigRock2SpeedX = (Math.random() * 2 - 1) / 3;
                    BigRock2SpeedY = (0.2 + Math.random() * 2) / 3;
                    BigRock2Rotate = parseInt(360 * Math.random());
                }
                if (BigRock3PosX >= 120 | BigRock3PosX <= -20 | BigRock3PosY >= 120) {
                    BigRock3PosX = 10 + parseInt(80 * Math.random());
                    BigRock3PosY = -10 - parseInt(90 * Math.random());
                    BigRock3SpeedX = (Math.random() * 2 - 1) / 3;
                    BigRock3SpeedY = (0.2 + Math.random() * 2) / 3;
                    BigRock3Rotate = parseInt(360 * Math.random());
                }

                requestAnimationFrame(gameLoop);
            }

            gameLoop();

            SmallRock1PosX = 10 + parseInt(80 * Math.random());
            SmallRock1PosY = -10 - parseInt(90 * Math.random());
            SmallRock1SpeedX = (Math.random() * 2 - 1) / 3;
            SmallRock1SpeedY = (0.2 + Math.random() * 2) / 3;
            SmallRock1Rotate = parseInt(360 * Math.random());

            SmallRock2PosX = 10 + parseInt(80 * Math.random());
            SmallRock2PosY = -10 - parseInt(90 * Math.random());
            SmallRock2SpeedX = (Math.random() * 2 - 1) / 3;
            SmallRock2SpeedY = (0.2 + Math.random() * 2) / 3;
            SmallRock2Rotate = parseInt(360 * Math.random());

            SmallRock3PosX = 10 + parseInt(80 * Math.random());
            SmallRock3PosY = -10 - parseInt(90 * Math.random());
            SmallRock3SpeedX = (Math.random() * 2 - 1) / 3;
            SmallRock3SpeedY = (0.2 + Math.random() * 2) / 3;
            SmallRock3Rotate = parseInt(360 * Math.random());

            BigRock1PosX = 10 + parseInt(80 * Math.random());
            BigRock1PosY = -10 - parseInt(90 * Math.random());
            BigRock1SpeedX = (Math.random() * 2 - 1) / 3;
            BigRock1SpeedY = (0.2 + Math.random() * 2) / 3;
            BigRock1Rotate = parseInt(360 * Math.random());

            BigRock2PosX = 10 + parseInt(80 * Math.random());
            BigRock2PosY = -10 - parseInt(90 * Math.random());
            BigRock2SpeedX = (Math.random() * 2 - 1) / 3;
            BigRock2SpeedY = (0.2 + Math.random() * 2) / 3;
            BigRock2Rotate = parseInt(360 * Math.random());

            BigRock3PosX = 10 + parseInt(80 * Math.random());
            BigRock3PosY = -10 - parseInt(90 * Math.random());
            BigRock3SpeedX = (Math.random() * 2 - 1) / 3;
            BigRock3SpeedY = (0.2 + Math.random() * 2) / 3;
            BigRock3Rotate = parseInt(360 * Math.random());

        });

    </script>
