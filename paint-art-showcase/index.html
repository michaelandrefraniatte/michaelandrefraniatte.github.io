        <meta charset="utf-8">

        <title>Paint Art by MAF</title>

        <script src="../extra/jquery-3.7.1.min.js"></script>

        <script src="../custom/redirect.js"></script>

        <style>
            body {
                background-color: #333;
                font-size: 3vw;
                color: white;
            }

            ::-webkit-scrollbar {
                width: 1.5vw;
                height: 1.5vw;
            }

            ::-webkit-scrollbar-track {
                background: #f1f1f1;
            }

            ::-webkit-scrollbar-thumb {
                background: #000;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #333;
                cursor: pointer;
            }

            .centered {
                width: 65.5vw;
                height: 40.5vw;
                position: absolute;
                top: 50%;
                left: 50%;
                margin-right: -50%;
                transform: translate(-50%, -50%);
                background-color: gray;
                overflow-x: scroll;
                text-align: left;
                white-space: nowrap;
                overflow-y: hidden;
            }

            .first {
                width: 65.5vw;
                height: 40.5vw;
                display: inline-block;
                overflow: hidden;
            }

            .second {
                width: 65.5vw;
                height: 40.5vw;
                display: inline-block;
                overflow: hidden;
            }

            .third {
                width: 65.5vw;
                height: 40.5vw;
                display: inline-block;
                overflow: hidden;
            }

            .left {
                position: absolute;
                top: calc(50% - 1.5vw);
                left: 7%;
                cursor: pointer;
            }

            .right {
                position: absolute;
                top: calc(50% - 1.5vw);
                right: 7%;
                cursor: pointer;
            }
        </style>

    </head>

    <body class>
        <div class="left" onclick="scrollToClass(-1)">&laquo;</div>
        <div class="centered" id="slider">
            <img class="first" src="img/bubble.jpg" />
            <img class="second" src="img/land.jpg" />
            <img class="third" src="img/rose.jpg" />
        </div>
        <div class="right" onclick="scrollToClass(1)">&raquo;</div>

        <copyrights
            style="display: float; float: right; position: fixed; right: 4px; bottom: 0px; color: white; text-align: center; font-family: sans-serif; font-size: 2.2vh; line-height: 2.2vh;">
            <b>© MAF</b></copyrights>

        <script>
            var classarray = [".first", ".second", ".third"];
            var index = 0;
            function scrollToClass(inc) {
                index += inc;
                if (index > classarray.length - 1) {
                    index = classarray.length - 1;
                    return;
                }
                if (index < 0) {
                    index = 0;
                    return;
                }
                document.querySelector(classarray[index]).scrollIntoView({
                    behavior: 'smooth',
                    block: 'end'
                });
            }
            document.getElementById("slider").addEventListener("scroll", scrolling);
            function scrolling() {
                index = parseInt(document.getElementById("slider").scrollLeft / 1008);
            }
        </script>
